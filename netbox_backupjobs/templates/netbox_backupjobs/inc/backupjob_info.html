{% load i18n %}

<div class="card">
  <h5 class="card-header">{% trans "Veeam BackupJobs" %}</h5>
  <div class="card-body">
    {% if backup_jobs %}
      <table class="table table-hover attr-table">
        <thead>
          <tr>
            <th>{% trans "Name" %}</th>
            <th>{% trans "Status" %}</th>
          </tr>
        </thead>
        <tbody>
          {% for job in backup_jobs %}
            <tr>
              <td><a href="{{ job.get_absolute_url }}">{{ job.name }}</a></td>
              <td>
                <span class="badge text-bg-{{ job.get_status_color }}">
                  {{ job.get_status_display }}
                </span>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="text-muted">{% trans "No backup jobs assigned." %}</p>
    {% endif %}
  </div>
</div>
